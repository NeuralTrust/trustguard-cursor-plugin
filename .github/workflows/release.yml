# Release trustguard-cursor without ever pushing to a protected branch.
#
# `main` is covered by the org ruleset main-rule (pull request + 1 approval),
# so the workflow can not commit the pinned bootstraps itself. It instead runs
# as a state machine over the version in plugin.json and the v* tags:
#
#   pinned version has no tag  -> publish: rebuild, verify the pins still match,
#                                 tag and cut the GitHub Release
#   pinned version is released -> prepare: bump the patch, pin the new
#                                 checksums, open or refresh the release PR
#
# So merging anything into main refreshes the release PR, and merging that PR
# publishes. State comes from the repo, not from commit messages, so it works
# with merge, squash or rebase.
#
# Manual run: Actions -> Release -> Run workflow.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Pinned so the publish job rebuilds binaries byte-identical to the ones the
  # prepare job measured. GOTOOLCHAIN=local forbids silently switching to a
  # newer toolchain, so raising the go directive in go.mod fails the build
  # until GO_VERSION is raised with it.
  GO_VERSION: '1.26.5'
  GOTOOLCHAIN: local

jobs:
  plan:
    name: Decide next action
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: plan
        run: |
          set -euo pipefail
          git fetch --tags --force
          python3 scripts/release.py plan >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  prepare:
    name: Refresh release PR
    needs: plan
    if: needs.plan.outputs.mode == 'prepare'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Bump, build and pin
        run: |
          set -euo pipefail
          python3 scripts/release.py set-version "$VERSION"
          scripts/build-dist.sh "$VERSION"
          python3 scripts/release.py pin "$VERSION"
          git --no-pager diff --stat

      - name: Open or refresh the release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="release/v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add -- \
            trustguard/.cursor-plugin/plugin.json \
            cli/main.go \
            trustguard/hooks/trustguard-hook.sh \
            trustguard/hooks/trustguard-hook.ps1
          if git diff --cached --quiet; then
            echo "main already carries the pins for v${VERSION} — nothing to propose"
            exit 0
          fi
          git commit -m "chore(release): v${VERSION}"
          git push --force origin "$BRANCH"

          body="$(cat <<EOF
          Pins \`v${VERSION}\` across \`plugin.json\`, \`cli/main.go\` and both bootstrap
          scripts, with the SHA-256 of the binaries built from ${GITHUB_SHA}.

          Merging this publishes the release: the workflow rebuilds the binaries, checks
          they still hash to the pins below, then tags \`v${VERSION}\` and uploads them.

          Opened automatically by the Release workflow.
          EOF
          )"
          number="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "chore(release): v${VERSION}" --body "$body"
          else
            gh pr create --base main --head "$BRANCH" \
              --title "chore(release): v${VERSION}" --body "$body"
          fi

  publish:
    name: Tag and publish
    needs: plan
    if: needs.plan.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: v${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Test
        run: go test -race ./cli/

      - name: Rebuild and verify the pins
        run: |
          set -euo pipefail
          scripts/build-dist.sh "$VERSION"
          python3 scripts/release.py verify "$VERSION"

      - name: Tag
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "${TAG} already tagged — reusing it"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "trustguard-cursor ${VERSION}"
          git push origin "$TAG"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes
          fi
          gh release create "$TAG" dist/* \
            --title "trustguard-cursor ${VERSION}" \
            --notes "$(cat <<EOF
          Automated release from \`main\`.

          TrustGuard integration binary for Cursor agent hooks. Verify downloads against
          \`SHA256SUMS\`; the plugin bootstraps on this tag are pinned to the same hashes.
          EOF
          )"
